name: 'Vigilnz Security Scan'
description: 'Check your applications for vulnerabilties using Vigilnz'
author: 'Vigilnz'
inputs:
  vigilnzApiKey:
    description: 'Vigilnz API token'
    required: true
  scanTypes:
    description: 'Comma-separated, case-insensitive list of scans to run: sca, sbom, sast, secret (or "secret scan"), iac (or "iac scan"), dast, container (or "container scan"). Example: "sca,sast,secret"'
    required: true
  projectName:
    description: 'Project name for the scan'
    required: false
  environment:
    description: 'Internal only — Vigilnz environment the scan targets (dev, demo, production)'
    required: false
    default: 'production'

  # Private repository access (repo-file scans only: sca/sbom/sast/iac/secret)
  repoAccessToken:
    description: >-
      Fallback access token for resolving this repository's metadata when it is private
      (e.g. ${{ secrets.GITHUB_TOKEN }} or a PAT with read access). Only used when the
      Vigilnz account has no GitHub integration connected that already covers this repo;
      never persisted — used only for the single scan request it is sent with.
    required: false

  # Wait / gating fields
  waitForCompletion:
    description: 'Block the job until every queued scan finishes (default false — queue and exit)'
    required: false
    default: 'false'
  timeoutMinutes:
    description: 'Maximum minutes to wait when waitForCompletion is true (1-360)'
    required: false
    default: '30'
  pollIntervalSeconds:
    description: 'Seconds between scan status polls (5-300)'
    required: false
    default: '15'
  failOnSeverity:
    description: 'Fail the job when findings at or above this severity exist (critical, high, medium, low, none). Requires waitForCompletion'
    required: false
    default: 'none'
  failOnScanError:
    description: 'Fail the job when a scan errors or times out. Requires waitForCompletion'
    required: false
    default: 'true'

  # Monorepo path scoping (repo-file scans only: sca/sbom/sast/iac/secret)
  includePaths:
    description: 'Comma-separated repository-root-relative paths to scan (e.g. "backend/,shared/"). Empty scans the whole repository'
    required: false
  excludePaths:
    description: 'Comma-separated repository-root-relative paths to skip. Applied after includePaths'
    required: false

  # DAST fields
  dastScanType:
    description: 'DAST scan type (e.g., spider, active)'
    required: false
  dastTargetUrl:
    description: 'Target URL for DAST scan'
    required: false

  # Container fields
  containerImage:
    description: 'Container image name (e.g., nginx:latest)'
    required: false
  containerProvider:
    description: 'Registry the image lives in: dockerhub (Docker Hub), aws-ecr (Amazon ECR), github (GitHub Container Registry / GHCR), gitlab (GitLab Container Registry), google (Google Container Registry / Artifact Registry), azure (Azure Container Registry / ACR), quay (Quay.io)'
    required: false
  containerRegistryType:
    description: 'Registry type (public, private, ecr-public, ecr-private, gcr, artifact, mcr)'
    required: false
  containerRegistryUrl:
    description: 'Registry URL (for private registries)'
    required: false
  containerAuthType:
    description: 'Authentication type (none, token, username-password)'
    required: false
  containerToken:
    description: 'Access token for container registry'
    required: false
  containerUsername:
    description: 'Username for container registry'
    required: false
  containerPassword:
    description: 'Password for container registry'
    required: false

outputs:
  scanTargetIds:
    description: 'Comma-separated scan target IDs created by this run'
  scanStatus:
    description: 'Aggregate status: pending (queue-only), complete, error or timed_out'
  repoUrl:
    description: 'Repository URL that was scanned'
  branch:
    description: 'Branch these scans were triggered for (empty if it could not be resolved from the workflow context)'
  criticalCount:
    description: 'Total critical findings across all scans (0 unless waitForCompletion is true)'
  highCount:
    description: 'Total high findings across all scans (0 unless waitForCompletion is true)'
  mediumCount:
    description: 'Total medium findings across all scans (0 unless waitForCompletion is true)'
  lowCount:
    description: 'Total low findings across all scans (0 unless waitForCompletion is true)'
  totalFindings:
    description: 'Total findings across all scans (0 unless waitForCompletion is true)'
  resultsJson:
    description: 'JSON array of per-scan outcomes, one per scan type queued. Each entry: scanTargetId, scanType, branch, status (pending/complete/error/timed_out), percent, message, scanId, summary ({critical,high,medium,low,totalFindings}), isSummaryAvailable. Same schema whether or not waitForCompletion was set.'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'shield'
  color: 'blue'
